# Cammut entry for the Codex CLI. Append it to ~/.codex/config.toml (after a backup).
# Create the token first with `cammut token create` and keep it in a user environment variable.
#
# Needs: an SSH tunnel to your server holding 127.0.0.1:7421, and the user variable
# CAMMUT_TOKEN (the value is never printed or written to a file).
# Fallback URL if the tunnel is down and the public name answers from this PC (UNVERIFIED):
#   url = "https://<your-cammut-host>/mcp"

[mcp_servers.cammut]
url = "http://127.0.0.1:7421/mcp"
bearer_token_env_var = "CAMMUT_TOKEN"
startup_timeout_sec = 30
tool_timeout_sec = 60

# The existing [mcp_servers.hindsight] and [mcp_servers.openviking] entries use the services' own
# full-power keys. After the Cammut entry works, remove them so Codex has one scoped door.
# Later, when Cammut 0.3.0+ with the memory upstream is deployed, create a second token with
#   -scopes 'memory/*' -profile direct:memory
# and point a second entry at it (memory_brief, memory_recall, memory_remember, memory_handoff, memory_projects).
